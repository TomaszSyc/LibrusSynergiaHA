get_message:
  name: Pobierz wiadomość
  description: Pobiera pełną treść wiadomości, co spowoduje oznaczenie jej jako 'przeczytanej' w systemie Librus. Może zwracać odpowiedź (response_variable) zawierającą treść wiadomości.
  fields:
    url:
      name: URL / Odnośnik
      description: Pełny link lub href wiadomości do pobrania z Librusa (znajdziesz go m.in. jako atrybut czujnika).
      required: true
      selector:
        text:
    entity_id:
      name: Czujnik wiadomości (opcjonalnie)
      description: Czujnik wiadomości ucznia, z którego konta ma zostać pobrana wiadomość (przydatne przy wielu uczniach).
      required: false
      selector:
        entity:
          domain: sensor

